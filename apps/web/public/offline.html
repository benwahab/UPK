<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>Hors ligne — UPK</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #ffffff; color: #0b0b0c; font-family: system-ui, sans-serif; }
      main { max-width: 28rem; padding: 2rem; text-align: center; }
      img { width: 7rem; height: auto; }
      h1 { font-size: 1.5rem; margin: 1.25rem 0 0.5rem; }
      p { color: #5b6470; line-height: 1.6; }
      a { display: inline-block; margin-top: 1rem; padding: 0.75rem 1.25rem; border-radius: 0.5rem; background: #c4002f; color: #ffffff; text-decoration: none; font-weight: 600; }
      @media (prefers-color-scheme: dark) { body { background: #0b0b0c; color: #ffffff; } p { color: #a1a1a6; } a { background: #ff6b35; color: #0b0b0c; } }
    </style>
  </head>
  <body>
    <main>
      <img src="/upk-logo.png" alt="UPK" width="432" height="183" />
      <h1>Vous êtes hors ligne</h1>
      <p>Reconnectez-vous pour retrouver les lieux près de vous.</p>
      <a href="/fr">Réessayer</a>
    </main>
  </body>
</html>
