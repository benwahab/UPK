<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hors ligne — UPK</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f7f5; color: #14231b; font-family: system-ui, sans-serif; }
      main { max-width: 28rem; padding: 2rem; text-align: center; }
      .badge { display: inline-grid; place-items: center; width: 4rem; height: 4rem; border-radius: 999px; background: #2f8f5b; color: #fff; font-weight: 700; font-size: 1.25rem; }
      h1 { font-size: 1.5rem; margin: 1rem 0 0.5rem; }
      p { color: #4b5b52; line-height: 1.6; }
      a { display: inline-block; margin-top: 1rem; padding: 0.75rem 1.25rem; border-radius: 0.5rem; background: #2f8f5b; color: #fff; text-decoration: none; font-weight: 600; }
      @media (prefers-color-scheme: dark) { body { background: #0f1d16; color: #f1f5f2; } p { color: #a9b8ae; } }
    </style>
  </head>
  <body>
    <main>
      <span class="badge" aria-hidden="true">UPK</span>
      <h1>Vous êtes hors ligne</h1>
      <p>Reconnectez-vous pour retrouver les lieux de Niamey.</p>
      <a href="/fr">Réessayer</a>
    </main>
  </body>
</html>
